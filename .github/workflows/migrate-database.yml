name: "Universal Database Migration (Local MySQL ⇄ Amazon RDS)"

# Run in architecture_mode = "migrating" (standalone server AND RDS both exist):
#   local-to-rds : upgrade path   (standalone -> migrating -> [this] -> enterprise)
#   rds-to-local : downgrade path (enterprise -> migrating -> [this] -> standalone)
on:
  workflow_dispatch:
    inputs:
      direction:
        description: "Migration Direction"
        required: true
        default: "local-to-rds"
        type: choice
        options:
          - "local-to-rds"
          - "rds-to-local"
      rds_endpoint:
        description: "RDS Endpoint Hostname (optional: auto-discovered if left blank)"
        required: false
        default: ""
        type: string

permissions:
  id-token: write # Required for AWS IAM OIDC
  contents: read  # Required for actions/checkout

# Never run a migration at the same time as a deploy or another migration
concurrency:
  group: deploy-app
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # All from Settings > Secrets and variables > Actions > Variables (README: Repository variables)
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
  DB_PASSWORD_PARAM: /${{ vars.PROJECT_NAME }}/db/password # same path as local.db_password_param in locals.tf

jobs:
  migrate:
    name: "Execute Database Migration via AWS SSM"
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Repository Variables
        run: bash .github/scripts/check-vars.sh AWS_REGION AWS_ROLE_ARN PROJECT_NAME DOMAIN_NAME

      # 2. Authenticate to AWS via OIDC (no static keys)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # 3. The migration always runs on the STANDALONE server (it holds local MySQL).
      #    Matching the exact Name tag means ASG servers can never be picked by mistake.
      - name: Locate Standalone Server
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${PROJECT_NAME}-standalone-web" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No running standalone server found. Set architecture_mode = \"migrating\" and apply first."
            exit 1
          fi

          echo "Target Instance: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      # 4. Resolve the RDS hostname
      - name: Resolve RDS Hostname
        id: get-rds
        run: |
          RDS_HOST="${{ github.event.inputs.rds_endpoint }}"

          if [ -z "$RDS_HOST" ]; then
            echo "Auto-discovering RDS endpoint..."
            RDS_HOST=$(aws rds describe-db-instances \
              --db-instance-identifier "${PROJECT_NAME}-db" \
              --query "DBInstances[0].Endpoint.Address" \
              --output text 2>/dev/null || echo "")
          fi

          if [ -z "$RDS_HOST" ] || [ "$RDS_HOST" = "None" ]; then
            echo "::error::Could not find RDS. Set architecture_mode = \"migrating\" and apply first, or pass the endpoint manually."
            exit 1
          fi

          echo "Resolved RDS Endpoint: $RDS_HOST"
          echo "rds_host=$RDS_HOST" >> "$GITHUB_OUTPUT"

      # 5. Run scripts/migrate-db.sh on the server through SSM Run Command.
      #    The script reads the DB password from SSM Parameter Store itself, so
      #    no secret ever passes through this workflow or the SSM command history.
      #    Before overwriting anything it uploads dumps of BOTH databases to
      #    s3://<project>-artifacts-<account>/db-backups/ (kept db_backup_retention_days).
      - name: Execute Migration via AWS SSM
        run: |
          INSTANCE_ID="${{ steps.get-instance.outputs.instance_id }}"
          RDS_HOST="${{ steps.get-rds.outputs.rds_host }}"
          DIRECTION="${{ github.event.inputs.direction }}"

          SCRIPT_BASE64=$(base64 -w 0 scripts/migrate-db.sh)
          # Off-server backups go to the private artifacts bucket (db-backups/)
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BACKUP_BUCKET="${PROJECT_NAME}-artifacts-${ACCOUNT_ID}"

          echo "Dispatching migration ($DIRECTION) to instance $INSTANCE_ID..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Database migration: $DIRECTION" \
            --timeout-seconds 1800 \
            --parameters "commands=[
              \"echo '$SCRIPT_BASE64' | base64 -d > /tmp/migrate-db.sh\",
              \"chmod +x /tmp/migrate-db.sh\",
              \"/tmp/migrate-db.sh $DIRECTION $RDS_HOST $DB_PASSWORD_PARAM $AWS_REGION $BACKUP_BUCKET\",
              \"rm -f /tmp/migrate-db.sh\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"
          ATTEMPTS=0
          while [ "$STATUS" = "Pending" ] || [ "$STATUS" = "InProgress" ]; do
            ATTEMPTS=$((ATTEMPTS+1))
            if [ $ATTEMPTS -gt 60 ]; then
              echo "::error::SSM migration command timed out!"
              exit 1
            fi
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
          done

          echo "Execution Status: $STATUS"
          echo "=== Output ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "=== Error Details ==="
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text
            echo "::error::Database migration failed!"
            exit 1
          fi

      # 6. Health check through the standalone server's Elastic IP, so it works
      #    whatever the DNS record currently points at.
      - name: Verify Standalone Server Health (Smoke Test)
        run: |
          INSTANCE_ID="${{ steps.get-instance.outputs.instance_id }}"
          IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)

          STATUS=000
          for attempt in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 \
              --resolve "$DOMAIN_NAME:80:$IP" --resolve "$DOMAIN_NAME:443:$IP" \
              "http://$DOMAIN_NAME/") || STATUS=000
            [ "$STATUS" = "200" ] && break
            echo "Attempt $attempt/6: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done

          if [ "$STATUS" != "200" ]; then
            echo "::error::Health check failed after migration! Expected HTTP 200, got $STATUS"
            exit 1
          fi
          echo "Standalone server healthy after migration (HTTP 200)"
