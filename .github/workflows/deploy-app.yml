name: "Deploy WordPress Application Code"

on:
  push:
    branches:
      - main
    paths:
      - "wp-content/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Target deployment scope"
        required: true
        default: "wp-content"
        type: choice
        options:
          - "wp-content"

permissions:
  id-token: write # Required for AWS IAM OIDC
  contents: read  # Required for actions/checkout

# One deployment at a time; a newer push waits for the running one to finish
concurrency:
  group: deploy-app
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::538820337783:role/GitHubActionsTerraformRole' }}
  DOMAIN_NAME: ${{ vars.DOMAIN_NAME || 'lab.asaxenadev.com' }}
  PROJECT_NAME: wp-lab

jobs:
  deploy:
    name: "Deploy to Web Instances (Standalone EC2 or ASG Fleet) via SSM"
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to AWS via OIDC (no static keys)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # 3. Package application code and the wp-config helper
      - name: Archive Application Code and Dynamic Config
        run: |
          tar -czf wp-content.tar.gz -C wp-content .
          BASE64_PAYLOAD=$(base64 -w 0 wp-content.tar.gz)
          echo "Payload size: $(echo -n "$BASE64_PAYLOAD" | wc -c) bytes"
          echo "PAYLOAD_BASE64=$BASE64_PAYLOAD" >> "$GITHUB_ENV"

          DOMAIN_SCRIPT_BASE64=$(base64 -w 0 .github/scripts/configure-domain.py)
          echo "DOMAIN_SCRIPT_BASE64=$DOMAIN_SCRIPT_BASE64" >> "$GITHUB_ENV"

      # 4. Publish the release to S3. Servers that the Auto Scaling Group launches
      #    later download releases/latest.tar.gz at boot (install.sh), so they
      #    match what is deployed now. History is kept 90 days for rollback.
      - name: Publish Release to Artifacts Bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${PROJECT_NAME}-artifacts-${ACCOUNT_ID}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3 cp wp-content.tar.gz "s3://$BUCKET/releases/history/${GITHUB_SHA}.tar.gz"
            aws s3 cp wp-content.tar.gz "s3://$BUCKET/releases/latest.tar.gz"
            echo "Published release ${GITHUB_SHA} to s3://$BUCKET/releases/"
          else
            echo "::warning::Artifacts bucket $BUCKET not found (run the Terraform pipeline first). New ASG servers won't get this release until it exists."
          fi

      # 5. Find running web servers (ASG fleet first, then the standalone server)
      - name: Locate Active Web Instances
        id: get-instances
        run: |
          echo "Discovering active web instances (ASG fleet first, then standalone)..."

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:aws:autoscaling:groupName,Values=${PROJECT_NAME}-asg*" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No ASG instances found. Looking for the standalone server..."
            INSTANCE_IDS=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=${PROJECT_NAME}-standalone-web" "Name=instance-state-name,Values=running" \
              --query "Reservations[*].Instances[*].InstanceId" \
              --output text)
          fi

          INSTANCE_IDS=$(echo "$INSTANCE_IDS" | xargs)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "::error::No active web instances found (checked both ASG and standalone tags)!"
            exit 1
          fi

          echo "Found Active Web Instances: $INSTANCE_IDS"
          echo "instance_ids=$INSTANCE_IDS" >> "$GITHUB_OUTPUT"

      # 6. Deploy through SSM Run Command (no SSH)
      - name: Deploy Code via AWS Systems Manager Run Command
        run: |
          INSTANCE_IDS="${{ steps.get-instances.outputs.instance_ids }}"
          echo "Dispatching deployment command to instances: $INSTANCE_IDS"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --comment "GitOps application deployment: wp-content ${GITHUB_SHA::7}" \
            --parameters 'commands=[
              "set -e",
              "mkdir -p /tmp/deploy",
              "echo \"${{ env.PAYLOAD_BASE64 }}\" | base64 -d > /tmp/deploy/wp-content.tar.gz",
              "mkdir -p /var/www/html/wp-content",
              "tar -xzf /tmp/deploy/wp-content.tar.gz -C /var/www/html/wp-content/",
              "rm -rf /tmp/deploy",
              "chown -R www-data:www-data /var/www/html/wp-content/",
              "find /var/www/html/wp-content/ -type d -exec chmod 755 {} \\;",
              "find /var/www/html/wp-content/ -type f -exec chmod 644 {} \\;",
              "echo \"${{ env.DOMAIN_SCRIPT_BASE64 }}\" | base64 -d > /tmp/configure-domain.py",
              "python3 /tmp/configure-domain.py",
              "php -l /var/www/html/wp-config.php",
              "systemctl reload nginx",
              "rm -f /tmp/configure-domain.py",
              "echo Application deployment and dynamic configuration successful!"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent with ID: $COMMAND_ID"
          sleep 5

          for ID in $INSTANCE_IDS; do
            echo "Verifying execution on node: $ID..."
            STATUS="Pending"
            ATTEMPTS=0
            while [ "$STATUS" = "Pending" ] || [ "$STATUS" = "InProgress" ]; do
              ATTEMPTS=$((ATTEMPTS+1))
              if [ $ATTEMPTS -gt 15 ]; then
                echo "::error::SSM command timed out on instance $ID"
                exit 1
              fi
              sleep 4
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$ID" \
                --query "Status" \
                --output text 2>/dev/null || echo "Pending")
            done

            OUTPUT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$ID" \
              --query "StandardOutputContent" \
              --output text)

            echo "Instance $ID result: $STATUS"
            echo "$OUTPUT"

            if [ "$STATUS" != "Success" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$ID" \
                --query "StandardErrorContent" --output text || true
              echo "::error::Deployment failed on instance $ID with status $STATUS"
              exit 1
            fi
          done

      # 7. Smoke test the live site (with retries for PHP-FPM / cache warm-up)
      - name: Verify Live Production Health (Smoke Test)
        run: |
          STATUS=000
          for attempt in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "https://$DOMAIN_NAME/") || STATUS=000
            [ "$STATUS" = "200" ] && break
            echo "Attempt $attempt/6: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          if [ "$STATUS" != "200" ]; then
            echo "::error::Application health check failed! Expected HTTP 200, got $STATUS"
            exit 1
          fi
          echo "Application deployment passed health check: HTTP 200"
