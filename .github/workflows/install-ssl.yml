name: "Universal SSL Certificate Automation"

# No load balancer : gets a Let's Encrypt certificate (Certbot) on the single
#                    server through SSM. Run it after the DNS A record points
#                    at the Elastic IP.
# Load balancer on : checks the ACM certificate on the ALB and prints the
#                    validation CNAME if it is still pending.
# Both             : if a single server exists, writes its Nginx site with
#                    .github/scripts/nginx-site.sh, which works directly AND
#                    behind the ALB (health check 200, no redirect loop).
#                    Run it once BEFORE turning on enable_alb for a server that
#                    already has Let's Encrypt.
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain name for SSL (leave empty to use the DOMAIN_NAME repo variable)"
        required: false
        default: ""
      email:
        description: "Admin email for Let's Encrypt (leave empty to use the ALERT_EMAIL repo secret)"
        required: false
        default: ""

permissions:
  id-token: write # Required for AWS IAM OIDC
  contents: read  # Required for actions/checkout

concurrency:
  group: deploy-app
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # All from Settings > Secrets and variables > Actions > Variables (README: Repository variables)
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  DOMAIN_NAME: ${{ github.event.inputs.domain || vars.DOMAIN_NAME }}

jobs:
  ssl:
    name: "Universal SSL Configuration & Diagnostics"
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Repository Variables
        run: bash .github/scripts/check-vars.sh AWS_REGION AWS_ROLE_ARN PROJECT_NAME DOMAIN_NAME

      # 2. Authenticate to AWS via OIDC (no static keys)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # 3. Detect whether a load balancer is in front (enterprise, or enable_alb)
      - name: Detect Ingress Architecture Mode
        id: detect-mode
        run: |
          echo "Scanning active AWS infrastructure topology..."
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --names "${PROJECT_NAME}-alb" \
            --query "LoadBalancers[0].LoadBalancerArn" \
            --output text 2>/dev/null || echo "")

          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            echo "mode=alb" >> "$GITHUB_OUTPUT"
            echo "alb_arn=$ALB_ARN" >> "$GITHUB_OUTPUT"
            echo "Load balancer found ($ALB_ARN): HTTPS is handled by ACM on the ALB."
          else
            echo "mode=standalone" >> "$GITHUB_OUTPUT"
            echo "No load balancer: HTTPS is handled by Let's Encrypt on the server."
          fi

      # 4. Find the single server (exact Name tag). Required without an ALB;
      #    optional with one (enterprise has a fleet instead).
      - name: Locate Standalone EC2 Instance
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${PROJECT_NAME}-standalone-web" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            if [ "${{ steps.detect-mode.outputs.mode }}" = "standalone" ]; then
              echo "::error::No running standalone server found!"
              exit 1
            fi
            echo "No single server (Auto Scaling fleet behind the ALB): nothing to configure on a server."
            echo "instance_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found Instance ID: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      # 5. [No ALB] Get (or keep) the Let's Encrypt certificate. "certonly" only
      #    fetches the certificate; step 6 owns the Nginx config.
      - name: Obtain Let's Encrypt Certificate via SSM
        if: steps.detect-mode.outputs.mode == 'standalone'
        run: |
          DOMAIN="$DOMAIN_NAME"
          # Email comes from the form, or else the ALERT_EMAIL repo secret (never hard-coded, masked in logs)
          EMAIL="${{ github.event.inputs.email || secrets.ALERT_EMAIL }}"
          if [ -z "$EMAIL" ]; then
            echo "::error::No email: enter one in the form or set the ALERT_EMAIL repository secret."
            exit 1
          fi

          bash .github/scripts/ssm-run.sh "${{ steps.get-instance.outputs.instance_id }}" "Let's Encrypt certificate for $DOMAIN" \
            "export DEBIAN_FRONTEND=noninteractive" \
            "apt-get update -y" \
            "apt-get install -y certbot python3-certbot-nginx" \
            "certbot certonly --nginx -d $DOMAIN --non-interactive --agree-tos -m $EMAIL --keep-until-expiring --deploy-hook 'systemctl reload nginx'" \
            || { echo "::error::Certbot failed. Check that the DNS A record for $DOMAIN points at the Elastic IP."; exit 1; }

      # 6. [Single server, any mode] Write the Nginx site that works directly
      #    and behind the ALB (backs up and restores the old config on failure)
      - name: Apply ALB-ready Nginx Site via SSM
        if: steps.get-instance.outputs.instance_id != ''
        run: |
          DOMAIN="$DOMAIN_NAME"
          SCRIPT_B64=$(base64 -w 0 .github/scripts/nginx-site.sh)

          bash .github/scripts/ssm-run.sh "${{ steps.get-instance.outputs.instance_id }}" "ALB-ready Nginx site for $DOMAIN" \
            "echo '$SCRIPT_B64' | base64 -d > /tmp/nginx-site.sh" \
            "bash /tmp/nginx-site.sh '$DOMAIN'; RC=\$?; rm -f /tmp/nginx-site.sh; exit \$RC" \
            || { echo "::error::Nginx site update failed; the previous config was restored. See the output above."; exit 1; }

      # 7. [ALB] Verify the ACM certificate on the ALB HTTPS listener
      - name: Verify ALB ACM SSL Configuration
        if: steps.detect-mode.outputs.mode == 'alb'
        run: |
          ALB_ARN="${{ steps.detect-mode.outputs.alb_arn }}"

          HTTPS_LISTENER=$(aws elbv2 describe-listeners \
            --load-balancer-arn "$ALB_ARN" \
            --query "Listeners[?Port==\`443\`].ListenerArn" \
            --output text 2>/dev/null || echo "")

          if [ -z "$HTTPS_LISTENER" ]; then
            echo "::warning::No HTTPS:443 listener on the ALB yet. The ACM certificate is probably still waiting for its DNS validation CNAME (terraform output acm_dns_validation_records)."
            exit 1
          fi

          echo "HTTPS Listener Active: $HTTPS_LISTENER"

          CERT_ARN=$(aws elbv2 describe-listeners \
            --listener-arns "$HTTPS_LISTENER" \
            --query "Listeners[0].Certificates[0].CertificateArn" \
            --output text)

          echo "Attached ACM Certificate: $CERT_ARN"

          STATUS=$(aws acm describe-certificate \
            --certificate-arn "$CERT_ARN" \
            --query "Certificate.Status" \
            --output text)

          echo "ACM Certificate Status: $STATUS"

          if [ "$STATUS" = "PENDING_VALIDATION" ]; then
            echo "::warning::ACM certificate is PENDING_VALIDATION. Add this CNAME at your DNS provider:"
            aws acm describe-certificate \
              --certificate-arn "$CERT_ARN" \
              --query "Certificate.DomainValidationOptions[*].{Domain:DomainName,CNAME_Name:ResourceRecord.Name,CNAME_Value:ResourceRecord.Value}" \
              --output table
          elif [ "$STATUS" = "ISSUED" ]; then
            echo "ACM certificate is ISSUED and protecting the ALB with TLS 1.3."
          fi

      # 8. End-to-end HTTPS smoke test
      - name: Verify Live HTTPS Health Check (Smoke Test)
        run: |
          DOMAIN="$DOMAIN_NAME"
          STATUS=000
          for attempt in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-redirs 5 --max-time 15 "https://$DOMAIN/") || STATUS=000
            [ "$STATUS" = "200" ] && break
            echo "Attempt $attempt/6: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          if [ "$STATUS" != "200" ]; then
            echo "::error::HTTPS health check failed! Expected HTTP 200, got $STATUS"
            exit 1
          fi
          echo "End-to-end SSL health check passed: https://$DOMAIN is secure and live (HTTP 200)"
