name: "Universal SSL Certificate Automation"

# Standalone mode : installs Let's Encrypt (Certbot) on the server through SSM.
#                   Run it after the Hostinger A record points at the Elastic IP.
# Enterprise mode : checks the ACM certificate on the ALB and prints the
#                   validation CNAME if it is still pending.
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain name for SSL"
        required: true
        default: "lab.asaxenadev.com"
      email:
        description: "Admin email for Let's Encrypt (leave empty to use the ALERT_EMAIL repo variable)"
        required: false
        default: ""

permissions:
  id-token: write # Required for AWS IAM OIDC
  contents: read  # Required for actions/checkout

concurrency:
  group: deploy-app
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::538820337783:role/GitHubActionsTerraformRole' }}
  PROJECT_NAME: wp-lab

jobs:
  ssl:
    name: "Universal SSL Configuration & Diagnostics"
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to AWS via OIDC (no static keys)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # 3. Detect which architecture is running (ALB vs standalone EC2)
      - name: Detect Ingress Architecture Mode
        id: detect-mode
        run: |
          echo "Scanning active AWS infrastructure topology..."
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --names "${PROJECT_NAME}-alb" \
            --query "LoadBalancers[0].LoadBalancerArn" \
            --output text 2>/dev/null || echo "")

          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            echo "mode=enterprise" >> "$GITHUB_OUTPUT"
            echo "alb_arn=$ALB_ARN" >> "$GITHUB_OUTPUT"
            echo "Enterprise mode detected: Application Load Balancer found ($ALB_ARN)."
          else
            echo "mode=standalone" >> "$GITHUB_OUTPUT"
            echo "Standalone mode detected: no ALB, single EC2."
          fi

      # 4. [Enterprise] Verify the ACM certificate on the ALB HTTPS listener
      - name: Verify ALB ACM SSL Configuration
        if: steps.detect-mode.outputs.mode == 'enterprise'
        run: |
          ALB_ARN="${{ steps.detect-mode.outputs.alb_arn }}"

          HTTPS_LISTENER=$(aws elbv2 describe-listeners \
            --load-balancer-arn "$ALB_ARN" \
            --query "Listeners[?Port==\`443\`].ListenerArn" \
            --output text 2>/dev/null || echo "")

          if [ -z "$HTTPS_LISTENER" ]; then
            echo "::warning::No HTTPS:443 listener found on the ALB. Check that architecture_mode = \"enterprise\" was applied."
            exit 1
          fi

          echo "HTTPS Listener Active: $HTTPS_LISTENER"

          CERT_ARN=$(aws elbv2 describe-listeners \
            --listener-arns "$HTTPS_LISTENER" \
            --query "Listeners[0].Certificates[0].CertificateArn" \
            --output text)

          echo "Attached ACM Certificate: $CERT_ARN"

          STATUS=$(aws acm describe-certificate \
            --certificate-arn "$CERT_ARN" \
            --query "Certificate.Status" \
            --output text)

          echo "ACM Certificate Status: $STATUS"

          if [ "$STATUS" = "PENDING_VALIDATION" ]; then
            echo "::warning::ACM certificate is PENDING_VALIDATION. Add this CNAME in Hostinger:"
            aws acm describe-certificate \
              --certificate-arn "$CERT_ARN" \
              --query "Certificate.DomainValidationOptions[*].{Domain:DomainName,CNAME_Name:ResourceRecord.Name,CNAME_Value:ResourceRecord.Value}" \
              --output table
          elif [ "$STATUS" = "ISSUED" ]; then
            echo "ACM certificate is ISSUED and protecting the ALB with TLS 1.3."
          fi

      # 5. [Standalone] Find the standalone server (exact Name tag)
      - name: Locate Standalone EC2 Instance
        if: steps.detect-mode.outputs.mode == 'standalone'
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${PROJECT_NAME}-standalone-web" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No running standalone server found!"
            exit 1
          fi

          echo "Found Instance ID: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      # 6. [Standalone] Install Let's Encrypt with Certbot through SSM
      - name: Execute Certbot SSL Installation via SSM
        if: steps.detect-mode.outputs.mode == 'standalone'
        run: |
          INSTANCE_ID="${{ steps.get-instance.outputs.instance_id }}"
          DOMAIN="${{ github.event.inputs.domain }}"
          # Email comes from the form, or else the ALERT_EMAIL repo variable (never hard-coded)
          EMAIL="${{ github.event.inputs.email || vars.ALERT_EMAIL }}"
          if [ -z "$EMAIL" ]; then
            echo "::error::No email: enter one in the form or set the ALERT_EMAIL repository variable."
            exit 1
          fi

          echo "Dispatching Certbot SSL command to instance $INSTANCE_ID for domain $DOMAIN..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Install Certbot Let's Encrypt SSL" \
            --parameters "commands=[
              \"export DEBIAN_FRONTEND=noninteractive\",
              \"apt-get update -y\",
              \"apt-get install -y certbot python3-certbot-nginx\",
              \"certbot --nginx -d $DOMAIN --non-interactive --agree-tos -m $EMAIL --redirect\",
              \"systemctl reload nginx\",
              \"echo 'SSL Certificate Installation Successful!'\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent with ID: $COMMAND_ID"
          echo "Waiting for SSL installation to complete..."

          STATUS="Pending"
          ATTEMPTS=0
          while [ "$STATUS" = "Pending" ] || [ "$STATUS" = "InProgress" ]; do
            ATTEMPTS=$((ATTEMPTS+1))
            if [ $ATTEMPTS -gt 25 ]; then
              echo "::error::SSM command timed out waiting for Certbot"
              exit 1
            fi
            sleep 6
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
          done

          echo "Execution Status: $STATUS"
          echo "=== Output ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "=== Error Details ==="
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text
            echo "::error::Certbot SSL installation failed! Check that the Hostinger A record points at the Elastic IP."
            exit 1
          fi

          echo "Let's Encrypt SSL installed successfully for https://$DOMAIN"

      # 7. End-to-end HTTPS smoke test
      - name: Verify Live HTTPS Health Check (Smoke Test)
        run: |
          DOMAIN="${{ github.event.inputs.domain }}"
          STATUS=000
          for attempt in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "https://$DOMAIN/") || STATUS=000
            [ "$STATUS" = "200" ] && break
            echo "Attempt $attempt/6: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          if [ "$STATUS" != "200" ]; then
            echo "::error::HTTPS health check failed! Expected HTTP 200, got $STATUS"
            exit 1
          fi
          echo "End-to-end SSL health check passed: https://$DOMAIN is secure and live (HTTP 200)"
